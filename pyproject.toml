[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foil-lab"
version = "2.0.0.dev0"
description = "2D airfoil analysis via a linear-vortex panel method, with viscous-inviscid coupling, e^n transition, a differentiable JAX core, and inverse design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Foil Lab contributors" }]
keywords = ["aerodynamics", "airfoil", "panel-method", "CFD", "XFOIL", "aircraft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0"]
batch = ["pyarrow>=12.0", "h5py>=3.8"]
jax = ["jax>=0.4.0"]
all = ["PySide6>=6.5", "pyarrow>=12.0", "h5py>=3.8", "jax>=0.4.0", "pytest>=7.0"]

[project.scripts]
foillab = "foil_lab.cli:main"

[project.gui-scripts]
foillab-gui = "foil_lab.gui.main_window:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foil_lab = ["data/**/*.csv"]

# Tests import the installed package: run `pip install -e ".[all]"` first.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: takes more than about 2 seconds; deselect with -m 'not slow'",
    "xfoil: needs /usr/bin/xfoil and xvfb-run; skipped automatically when either is missing",
]
